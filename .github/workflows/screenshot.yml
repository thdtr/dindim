# Takes the README screenshots: dindim on a real macOS desktop, open on a demo
# account in English and in Brazilian Portuguese. Run it by hand from the
# Actions tab and download the "screenshots" artifact.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          cargo build --release --locked -p dindim
          cargo build --release --locked -p dindim-store --example demo

      # The runner's own screen only has 1x modes. A HiDPI virtual display
      # makes the capture come out at 2x.
      - name: HiDPI display
        id: hidpi
        continue-on-error: true
        run: |
          clang -fobjc-arc -framework Foundation -framework CoreGraphics \
            tools/screenshot/virtual-display.m -o virtual-display
          ./virtual-display > virtual-display.log 2>&1 &
          sleep 6
          cat virtual-display.log
          grep -q ' pixels' virtual-display.log

      # Fallback: the runner's screen starts at 1024x768, smaller than the
      # app's 1280x840 window, so pick its largest mode.
      - name: 1x display
        if: steps.hidpi.outcome != 'success'
        run: |
          brew install displayplacer
          displayplacer list | tee display.txt
          id=$(awk '/Persistent screen id:/ { print $4; exit }' display.txt)
          res=$(grep -E 'mode [0-9]+: res:' display.txt | sed -E 's/.*res:([0-9]+x[0-9]+).*/\1/' | sort -t x -n | tail -1)
          displayplacer "id:$id res:$res scaling:off"
          sleep 3

      - name: Capture
        run: |
          mkdir -p shots
          capture() {
            locale="$1" name="$2" currency="$3" id="$4"
            home="$RUNNER_TEMP/dindim-$locale"
            ./target/release/examples/demo "$home/data" "tools/screenshot/demo/$locale.csv" \
              "$name" "$currency" "$(date +%F)"
            mkdir -p "$home/config"
            printf 'language = "%s"\ntheme = "light"\nlast-account = "%s"\nauto-backup = false\n' \
              "$locale" "$id" > "$home/config/preferences.toml"
            DINDIM_HOME="$home" ./target/release/dindim &
            pid=$!
            sleep 12
            osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $pid) to true" || true
            sleep 2
            window=$(swift tools/screenshot/window-id.swift "$pid")
            screencapture -x -l "$window" "shots/screenshot-$locale.png"
            osascript -e 'tell application "System Events" to keystroke "2" using command down' || true
            sleep 2
            screencapture -x -l "$window" "shots/report-$locale.png" || true
            kill "$pid"
            sleep 2
          }
          capture en-US Personal USD personal
          capture pt-BR Pessoal BRL pessoal
          sips -g pixelWidth -g pixelHeight shots/*.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: shots/
