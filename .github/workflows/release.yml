name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p dindim
      - name: Package
        run: |
          name="dindim-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/dindim packaging/linux/dindim.desktop LICENSE NOTICE "dist/$name/"
          cp assets/dindim.svg "dist/$name/dindim.svg"
          cp assets/icons/dindim-256.png "dist/$name/dindim.png"
          cargo about generate -c packaging/licenses/about.toml packaging/licenses/about.hbs \
            -o "dist/$name/THIRD-PARTY-LICENSES.html"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*

  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      - run: cargo test --workspace --locked
      - run: |
          cargo build --release --locked -p dindim --target aarch64-apple-darwin
          cargo build --release --locked -p dindim --target x86_64-apple-darwin
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="dindim-${GITHUB_REF_NAME}-macos-universal"
          app="dist/$name/dindim.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/dindim" \
            target/aarch64-apple-darwin/release/dindim \
            target/x86_64-apple-darwin/release/dindim
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp assets/icons/dindim.icns "$app/Contents/Resources/dindim.icns"
          cp LICENSE NOTICE "$app/Contents/Resources/"
          cargo about generate -c packaging/licenses/about.toml packaging/licenses/about.hbs \
            -o "$app/Contents/Resources/THIRD-PARTY-LICENSES.html"
          codesign --force --deep --sign - "$app"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ln -s /Applications "dist/$name/Applications"
          hdiutil create -volname dindim -srcfolder "dist/$name" -ov -format UDZO "dist/$name.dmg"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" \
            && shasum -a 256 "$name.dmg" > "$name.dmg.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.tar.gz*
            dist/*.dmg*

  windows:
    name: Windows (x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p dindim
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "dindim-$($env:GITHUB_REF_NAME)-windows-x86_64"
          $dir = "dist\$name"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item target\release\dindim.exe, LICENSE, NOTICE $dir
          cargo about generate -c packaging/licenses/about.toml packaging/licenses/about.hbs -o "$dir\THIRD-PARTY-LICENSES.html"
          Compress-Archive -Path $dir -DestinationPath "dist\$name.zip"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$(Resolve-Path $dir)" "/DOutputDir=$(Resolve-Path dist)" packaging\windows\dindim.iss
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)" -NoNewline
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.zip*
            dist/*.exe*

  publish:
    name: Publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install.sh scripts/install.ps1 \
            --title "dindim $GITHUB_REF_NAME" --notes-file notes.md $prerelease
