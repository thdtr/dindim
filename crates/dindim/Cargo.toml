[package]
name = "dindim"
description = "A fast, private expense tracker for your desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["finance", "budget", "expense-tracker", "desktop", "iced"]
categories = ["gui", "finance"]

[dependencies]
dindim-core.workspace = true
dindim-store.workspace = true
dindim-i18n.workspace = true
jiff = { version = "1" }
serde.workspace = true
tracing.workspace = true
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced", "lazy"] }
rfd = "0.18"
directories = "6"
toml = "1"
sys-locale = "0.3"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
semver = "1"
open = "5"
tokio = { version = "1", features = ["rt"] }
serde_json.workspace = true

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
